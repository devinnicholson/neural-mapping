name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,numeric]'
      - name: Compile Python sources
        run: python -m compileall -q src scripts modal_app.py
      - name: Run unit tests
        run: python -m pytest -q
      - name: Validate committed JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path('.').glob('**/*.json')):
              if any(part.startswith('.') for part in path.parts):
                  continue
              json.loads(path.read_text(encoding='utf-8'))
              print(path)
          PY
      - name: Recompute confirmatory record and generated assets
        if: matrix.python-version == '3.12'
        run: |
          python scripts/build_icl_benchmark_record.py \
            --artifact-root experiments/artifacts/icl_nuim_multitrajectory_v1 \
            --protocol experiments/protocols/icl_nuim_multitrajectory_v1.json \
            --run-manifest experiments/run_manifests/icl_nuim_multitrajectory_v1.json \
            --output experiments/records/icl_nuim_multitrajectory_v1.json
          python scripts/generate_icl_report_assets.py
          git diff --exit-code -- experiments/records paper/tables experiments/tables docs/icl_nuim_multitrajectory_v1.md

  paper:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compile paper
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: main.tex
          working_directory: paper
