<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">TUM FR1 desk v4 compact active validation</title>
  <desc id="desc">Compact plot of PSNR and aligned AbsRel deltas for budget 50 and budget 100 on TUM FR1 desk v4.</desc>
  <defs>
    <style>
      .bg { fill: #f4f5f3; }
      .panel { fill: #ffffff; stroke: #dfe4df; }
      .axis { stroke: #bcc7bf; stroke-width: 1; }
      .grid { stroke: #edf0ed; stroke-width: 1; }
      .text { fill: #171b18; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #5d665f; }
      .good { fill: #1f684e; }
      .bad { fill: #9b3f3b; }
      .blue { fill: #2f5f86; }
    </style>
  </defs>
  <rect class="bg" width="920" height="520"/>
  <text class="text" x="42" y="48" font-size="24" font-weight="760">TUM FR1 desk v4: active minus random</text>
  <text class="text muted" x="42" y="74" font-size="13">Depth-gradient hybrid selector, score_weight=0.65, 7k Splatfacto iterations</text>

  <rect class="panel" x="40" y="104" width="840" height="160" rx="7"/>
  <text class="text" x="64" y="134" font-size="14" font-weight="730">Delta PSNR, higher is better</text>
  <line class="grid" x1="64" y1="178" x2="856" y2="178"/>
  <line class="axis" x1="160" y1="150" x2="160" y2="232"/>
  <text class="text muted" x="132" y="248" font-size="11">0</text>
  <text class="text muted" x="832" y="238" font-size="11">+1.0</text>

  <text class="text muted" x="86" y="173" font-size="12">b50</text>
  <rect class="good" x="160" y="158" width="696" height="20" rx="3"/>
  <text class="text" x="748" y="173" font-size="12" font-weight="700">+0.994</text>
  <text class="text muted" x="86" y="213" font-size="12">b100</text>
  <rect class="good" x="160" y="198" width="496" height="20" rx="3"/>
  <text class="text" x="666" y="213" font-size="12" font-weight="700">+0.708</text>

  <rect class="panel" x="40" y="294" width="840" height="160" rx="7"/>
  <text class="text" x="64" y="324" font-size="14" font-weight="730">Delta aligned AbsRel, lower is better</text>
  <line class="grid" x1="64" y1="368" x2="856" y2="368"/>
  <line class="axis" x1="640" y1="340" x2="640" y2="422"/>
  <text class="text muted" x="96" y="428" font-size="11">-0.04</text>
  <text class="text muted" x="634" y="438" font-size="11">0</text>

  <text class="text muted" x="86" y="363" font-size="12">b50</text>
  <rect class="good" x="145" y="348" width="495" height="20" rx="3"/>
  <text class="text" x="82" y="363" font-size="12" font-weight="700" transform="translate(48 0)">-0.033</text>
  <text class="text muted" x="86" y="403" font-size="12">b100</text>
  <rect class="good" x="280" y="388" width="360" height="20" rx="3"/>
  <text class="text" x="214" y="403" font-size="12" font-weight="700">-0.024</text>

  <rect class="panel" x="676" y="338" width="178" height="72" rx="7"/>
  <text class="text muted" x="692" y="363" font-size="12">Raw AbsRel b100</text>
  <text class="text bad" x="692" y="389" font-size="22" font-weight="760">+0.005</text>
  <text class="text muted" x="762" y="389" font-size="12">small regression</text>

  <text class="text muted" x="42" y="490" font-size="12">Source: docs/results.md, TUM FR1 desk v4 compact validation. Positive PSNR is good; negative AbsRel is good.</text>
</svg>
