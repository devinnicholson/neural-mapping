<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">TUM FR1 room v4 compact stress result</title>
  <desc id="desc">Compact plot of PSNR and aligned AbsRel deltas for budget 50 and budget 100 on TUM FR1 room v4.</desc>
  <defs>
    <style>
      .bg { fill: #f4f5f3; }
      .panel { fill: #ffffff; stroke: #dfe4df; }
      .axis { stroke: #bcc7bf; stroke-width: 1; }
      .grid { stroke: #edf0ed; stroke-width: 1; }
      .text { fill: #171b18; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #5d665f; }
      .good { fill: #1f684e; }
      .bad { fill: #9b3f3b; }
      .warn { fill: #8a6a19; }
    </style>
  </defs>
  <rect class="bg" width="920" height="520"/>
  <text class="text" x="42" y="48" font-size="24" font-weight="760">TUM FR1 room v4: active minus random</text>
  <text class="text muted" x="42" y="74" font-size="13">Transmittance hybrid selector, score_weight=0.65, 7k Splatfacto iterations</text>

  <rect class="panel" x="40" y="104" width="840" height="160" rx="7"/>
  <text class="text" x="64" y="134" font-size="14" font-weight="730">Delta PSNR, higher is better</text>
  <line class="grid" x1="64" y1="178" x2="856" y2="178"/>
  <line class="axis" x1="520" y1="150" x2="520" y2="232"/>
  <text class="text muted" x="512" y="248" font-size="11">0</text>
  <text class="text muted" x="178" y="238" font-size="11">-0.4</text>
  <text class="text muted" x="792" y="238" font-size="11">+0.4</text>

  <text class="text muted" x="86" y="173" font-size="12">b50</text>
  <rect class="good" x="520" y="158" width="31" height="20" rx="3"/>
  <text class="text" x="560" y="173" font-size="12" font-weight="700">+0.035</text>
  <text class="text muted" x="86" y="213" font-size="12">b100</text>
  <rect class="bad" x="168" y="198" width="352" height="20" rx="3"/>
  <text class="text" x="98" y="213" font-size="12" font-weight="700">-0.400</text>

  <rect class="panel" x="40" y="294" width="840" height="160" rx="7"/>
  <text class="text" x="64" y="324" font-size="14" font-weight="730">Delta aligned AbsRel, lower is better</text>
  <line class="grid" x1="64" y1="368" x2="856" y2="368"/>
  <line class="axis" x1="520" y1="340" x2="520" y2="422"/>
  <text class="text muted" x="188" y="438" font-size="11">-0.04</text>
  <text class="text muted" x="514" y="438" font-size="11">0</text>
  <text class="text muted" x="778" y="438" font-size="11">+0.04</text>

  <text class="text muted" x="86" y="363" font-size="12">b50</text>
  <rect class="good" x="238" y="348" width="282" height="20" rx="3"/>
  <text class="text" x="166" y="363" font-size="12" font-weight="700">-0.032</text>
  <text class="text muted" x="86" y="403" font-size="12">b100</text>
  <rect class="bad" x="520" y="388" width="273" height="20" rx="3"/>
  <text class="text" x="804" y="403" font-size="12" font-weight="700">+0.031</text>

  <rect class="panel" x="610" y="140" width="246" height="74" rx="7"/>
  <text class="text muted" x="628" y="166" font-size="12">Stress-test read</text>
  <text class="text warn" x="628" y="192" font-size="18" font-weight="760">b50 mixed, b100 fails</text>

  <text class="text muted" x="42" y="490" font-size="12">Source: docs/results.md, TUM FR1 room v4 compact stress test. Positive PSNR is good; negative AbsRel is good.</text>
</svg>
