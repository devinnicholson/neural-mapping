<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">TUM FR1 xyz v9 active minus random budget sweep</title>
  <desc id="desc">Compact plot of PSNR and aligned AbsRel deltas across budgets 50, 75, 100, 125, and 150.</desc>
  <defs>
    <style>
      .bg { fill: #f4f5f3; }
      .panel { fill: #ffffff; stroke: #dfe4df; }
      .axis { stroke: #bcc7bf; stroke-width: 1; }
      .grid { stroke: #edf0ed; stroke-width: 1; }
      .text { fill: #171b18; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #5d665f; }
      .good { fill: #1f684e; }
      .bad { fill: #9b3f3b; }
      .mixed { fill: #7a662d; }
    </style>
  </defs>
  <rect class="bg" width="920" height="520" rx="0"/>
  <text class="text" x="42" y="48" font-size="24" font-weight="760">TUM FR1 xyz v9: active minus random</text>
  <text class="text muted" x="42" y="74" font-size="13">Depth-gradient hybrid selector, score_weight=0.65, 7k Splatfacto iterations</text>

  <rect class="panel" x="40" y="104" width="840" height="160" rx="7"/>
  <text class="text" x="64" y="134" font-size="14" font-weight="730">Delta PSNR, higher is better</text>
  <line class="grid" x1="64" y1="178" x2="856" y2="178"/>
  <line class="axis" x1="460" y1="150" x2="460" y2="232"/>
  <text class="text muted" x="64" y="238" font-size="11">-0.8</text>
  <text class="text muted" x="448" y="248" font-size="11">0</text>
  <text class="text muted" x="827" y="238" font-size="11">+0.4</text>

  <text class="text muted" x="86" y="167" font-size="12">b50</text>
  <rect class="good" x="460" y="153" width="101" height="18" rx="3"/>
  <text class="text" x="568" y="167" font-size="12" font-weight="700">+0.161</text>
  <text class="text muted" x="86" y="187" font-size="12">b75</text>
  <rect class="good" x="460" y="153" width="226" height="18" rx="3" transform="translate(0 20)"/>
  <text class="text" x="694" y="187" font-size="12" font-weight="700">+0.362</text>
  <text class="text muted" x="86" y="207" font-size="12">b100</text>
  <rect class="good" x="460" y="153" width="79" height="18" rx="3" transform="translate(0 40)"/>
  <text class="text" x="546" y="207" font-size="12" font-weight="700">+0.127</text>
  <text class="text muted" x="86" y="227" font-size="12">b125</text>
  <rect class="good" x="460" y="153" width="159" height="18" rx="3" transform="translate(0 60)"/>
  <text class="text" x="627" y="227" font-size="12" font-weight="700">+0.254</text>
  <text class="text muted" x="86" y="247" font-size="12">b150</text>
  <rect class="bad" x="70" y="233" width="390" height="18" rx="3"/>
  <text class="text" x="170" y="247" font-size="12" font-weight="700">-0.779 saturation check</text>

  <rect class="panel" x="40" y="294" width="840" height="160" rx="7"/>
  <text class="text" x="64" y="324" font-size="14" font-weight="730">Delta aligned AbsRel, lower is better</text>
  <line class="grid" x1="64" y1="368" x2="856" y2="368"/>
  <line class="axis" x1="260" y1="340" x2="260" y2="422"/>
  <text class="text muted" x="64" y="428" font-size="11">-0.02</text>
  <text class="text muted" x="253" y="438" font-size="11">0</text>
  <text class="text muted" x="825" y="428" font-size="11">+0.07</text>

  <text class="text muted" x="86" y="357" font-size="12">b50</text>
  <rect class="good" x="200" y="343" width="60" height="18" rx="3"/>
  <text class="text" x="134" y="357" font-size="12" font-weight="700">-0.006</text>
  <text class="text muted" x="86" y="377" font-size="12">b75</text>
  <rect class="bad" x="260" y="363" width="10" height="18" rx="3"/>
  <text class="text" x="276" y="377" font-size="12" font-weight="700">+0.001</text>
  <text class="text muted" x="86" y="397" font-size="12">b100</text>
  <rect class="good" x="180" y="383" width="80" height="18" rx="3"/>
  <text class="text" x="114" y="397" font-size="12" font-weight="700">-0.008</text>
  <text class="text muted" x="86" y="417" font-size="12">b125</text>
  <rect class="bad" x="260" y="403" width="70" height="18" rx="3"/>
  <text class="text" x="336" y="417" font-size="12" font-weight="700">+0.007</text>
  <text class="text muted" x="86" y="437" font-size="12">b150</text>
  <rect class="bad" x="260" y="423" width="560" height="18" rx="3"/>
  <text class="text" x="635" y="437" font-size="12" font-weight="700">+0.065 saturation loss</text>

  <text class="text muted" x="42" y="490" font-size="12">Source: docs/results.md, TUM FR1 XYZ v9 Budget Sweep. Positive PSNR is good; negative AbsRel is good.</text>
</svg>
